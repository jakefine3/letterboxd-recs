[theme]
base = "dark"
primaryColor = "#00e054"
backgroundColor = "#14181c"
secondaryBackgroundColor = "#2c3440"
textColor = "#9ab"
font = "sans serif"

[browser]
gatherUsageStats = false

[server]
headless = true

[client]
# visitors see a generic error, never exception messages or tracebacks
# (request errors can echo URLs with API keys in them); details go to the logs
showErrorDetails = "type"
